# Run the published multi-architecture image from GitHub Container Registry.
#
# This is the "no local build" path: it pulls the image CI already built and
# pushed (linux/amd64 + linux/arm64) instead of compiling on the local machine.
# Use it when you want to run a released version rather than your working tree.
#
#   docker compose -f docker-compose.release.yml pull
#   docker compose -f docker-compose.release.yml up -d
#
# Pin IMAGE to a specific release tag for reproducibility, e.g.
#   IMAGE=ghcr.io/perchemop/weather-monitor:v0.1.2 docker compose -f docker-compose.release.yml up -d
#
# For building from source instead, use docker-compose.yml.

services:
  weather-monitor:
    image: ${IMAGE:-ghcr.io/perchemop/weather-monitor:latest}
    container_name: weather-monitor
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    volumes:
      # Persist the SQLite database, backups, and generated secrets.
      - ./data:/app/data
    # Keep files created in ./data owned by the host user (uid/gid 1000) so a
    # local dev run and the container can share the same data directory.
    user: '1000:1000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
