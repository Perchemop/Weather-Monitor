name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the changed-file diff can resolve the base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Format check (hygiene)
        shell: bash
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF" --depth=50 || true
          node scripts/check-format.mjs --changed-from "origin/$BASE_REF"

      - name: Style check (Prettier)
        shell: bash
        run: |
          npm ci
          npx prettier --check .

  security-compliance:
    name: security-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency licence policy check
        run: node scripts/check-licences.mjs

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # dependency-review requires the pull-request context.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          node -e "const fs=require('fs');for (const f of ['dist/server.cjs','dist/index.html','dist/sw.js']) { if(!fs.existsSync(f)) { console.error('missing '+f); process.exit(1);} }"

      - name: Static build (GitHub Pages variant)
        env:
          VITE_APP_MODE: static
        run: npm run build:static

      - name: Verify static build output
        run: |
          node -e "const fs=require('fs');if(!fs.existsSync('dist-static/index.html')||!fs.existsSync('dist-static/assets')){console.error('missing static output');process.exit(1);}"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### build-test — ${{ matrix.os }}"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| type-check, tests, build, static build | see job logs |"
            echo ""
            echo "Test suite: 57 system + 29 integration = 86 automated checks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artefacts (Linux)
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            dist-static/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container image
        run: docker build -t construction-weather-monitor:ci .
