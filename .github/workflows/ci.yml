name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the changed-file diff can resolve the base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Format check (hygiene)
        shell: bash
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          # No `|| true`: a failed fetch means the base ref is missing and the
          # changed-file check would silently degrade to a whole-tree scan.
          git fetch --no-tags origin "$BASE_REF" --depth=50
          git rev-parse --verify "origin/$BASE_REF"
          node scripts/check-format.mjs --changed-from "origin/$BASE_REF"

      - name: Style check (Prettier)
        shell: bash
        run: |
          npm ci
          npx prettier --check .

  security-compliance:
    name: security-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency licence policy check
        run: node scripts/check-licences.mjs

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # dependency-review requires the pull-request context.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          node -e "const fs=require('fs');for (const f of ['dist/server.cjs','dist/index.html','dist/sw.js']) { if(!fs.existsSync(f)) { console.error('missing '+f); process.exit(1);} }"

      - name: Static build (GitHub Pages variant)
        env:
          VITE_APP_MODE: static
        run: npm run build:static

      - name: Verify static build output
        run: |
          node -e "const fs=require('fs');if(!fs.existsSync('dist-static/index.html')||!fs.existsSync('dist-static/assets')){console.error('missing static output');process.exit(1);}"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### build-test — ${{ matrix.os }}"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| type-check, tests, build, static build | see job logs |"
            echo ""
            echo "Test suite: 57 system + 29 integration = 86 automated checks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artefacts (Linux)
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            dist-static/
          if-no-files-found: warn
          retention-days: 7

  ui-tests:
    name: ui-tests (Playwright smoke)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Browser downloads dominate this job; the cache key tracks the lockfile
      # so a Playwright upgrade refetches and a code-only change does not.
      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test --config tests/ui/playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/ui/playwright-report
          retention-days: 7

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: tests/ui/test-results
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [build-test, ui-tests]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container image
        run: docker build -t construction-weather-monitor:ci .

  # Workflow hygiene (guide §4): lint every workflow file so an unpinned action,
  # a bad expression or an unsafe `run:` block cannot reach the default branch.
  # actionlint runs shellcheck over `run:` blocks automatically (shellcheck is
  # preinstalled on ubuntu runners).
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint (pinned release, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Lint workflows (actionlint + shellcheck)
        run: ./actionlint -color

  # A lockfile that changes on its own is unreviewable: the diff is generated
  # and hides dependency swaps. Require it to travel with package.json.
  lockfile-integrity:
    name: lockfile-integrity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout (full history so the merge base resolves)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: package-lock.json must change together with package.json
        shell: bash
        run: |
          BASE_REF="${{ github.base_ref }}"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$changed"
          if grep -qx 'package-lock.json' <<< "$changed" && ! grep -qx 'package.json' <<< "$changed"; then
            echo "::error::package-lock.json changed without package.json — regenerate it together with the manifest."
            exit 1
          fi
          echo "lockfile/manifest pairing is consistent."
