name: Release

# Progressive semver releases (guide §4 / §6). A tag push builds the server
# bundle and the static bundle, gates on the full verification suite, refuses a
# tag that disagrees with `package.json`, attaches checksummed artefacts (the
# CycloneDX SBOM and `SHA256SUMS.txt` included) and publishes a **draft** GitHub
# Release whose notes come from the matching CHANGELOG section (falling back to
# generated notes). A human reviews and publishes the draft.
#
# Integrity: the archives are verified with `sha256sum -c` after packaging and
# the checksum file ships with the release. Keyless signing (cosign/sigstore) is
# deliberately not wired in yet — it needs `id-token: write` plus a decision on
# the signing identity that only the owner can take, and a GPG detached
# signature needs a private key this repository does not hold. The checksums are
# the integrity gate until one of those is chosen.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishing is gated by the `release` environment (protection rules live in
    # the repository settings), and the tag must already be on main: a tag
    # cannot smuggle unreviewed commits into a release.
    environment: release
    steps:
      - name: Checkout (full history for the personal-data scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release gate scans the whole history, not just the tagged tree.
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            printf 'tag "%s" ("%s") is on origin/main\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          else
            printf 'refusing to release: "%s" is not an ancestor of origin/main\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # `package.json` owns the version; a tag that disagrees would ship an app
      # reporting a version it was not released under.
      - name: Verify the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test suite (88 checks)
        run: npm test

      - name: Build server bundle
        run: npm run build

      - name: Build static bundle (GitHub Pages variant)
        run: npm run build:static

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Package artefacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "construction-weather-monitor-${VERSION}-server.tar.gz" dist
          cd dist-static && zip -qr "../construction-weather-monitor-${VERSION}-static.zip" . && cd ..
          sha256sum "construction-weather-monitor-${VERSION}-server.tar.gz" \
                    "construction-weather-monitor-${VERSION}-static.zip" \
                    sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Nothing is attached until the archived bytes on disk match the published
      # checksums (suite standard: SHA256SUMS.txt + verified artefacts).
      - name: Verify the artefact checksums
        run: sha256sum -c SHA256SUMS.txt

      # Full personal-data and secret scan (guide II.29.2/II.29.3/II.29.5): the
      # whole tree, the whole history, the commit/tag metadata, and the built
      # artefacts themselves — before any asset is attached to a release.
      - name: Personal-data and secret scan (tree, history, metadata, artefacts)
        env:
          PERSONAL_DENYLIST: ${{ secrets.PERSONAL_DENYLIST }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf /tmp/release-assets && mkdir -p /tmp/release-assets/static
          tar -xzf "construction-weather-monitor-${VERSION}-server.tar.gz" -C /tmp/release-assets
          unzip -q "construction-weather-monitor-${VERSION}-static.zip" -d /tmp/release-assets/static
          node scripts/scan-personal-data.mjs --tree --metadata --history --paths /tmp/release-assets

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Take the body of the "## [x.y.z]" section that matches this tag.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'No CHANGELOG section for %s; using generated notes.\n' "${VERSION}" >&2
            printf 'Release %s \u2014 see CHANGELOG.md for details.\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      # Suite standard (guide §12.1): the published notes reference the
      # CI-managed token ledger. `docs/tokens.json` is owned by the docs agent;
      # skip with a warning until it lands rather than failing a release.
      - name: Append token metrics to the release notes
        run: |
          if [ ! -f docs/tokens.json ]; then
            echo "docs/tokens.json is missing; skipping the token-metrics section." >&2
            exit 0
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "### Token metrics"
            echo ""
            echo '```json'
            cat docs/tokens.json
            echo '```'
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Draft: a human reviews and publishes it (guide §2.5/§9).
          draft: true
          body_path: release-notes.md
          files: |
            construction-weather-monitor-*.tar.gz
            construction-weather-monitor-*.zip
            sbom.cdx.json
            SHA256SUMS.txt

      - name: Upload build artefacts (workflow run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            dist-static/
            sbom.cdx.json
            SHA256SUMS.txt
          retention-days: 14

  # Multi-architecture container image (research: multi-arch-container-images.md).
  # Only tags publish to GHCR; PR verification stays build-only in ci.yml.
  # The image name is written in lowercase — Docker references are
  # case-sensitive and GHCR rejects mixed-case paths.
  container-image:
    name: Container image (linux/amd64 + linux/arm64)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Reuse the GitHub Actions layer cache so a re-run does not rebuild
          # both architectures from scratch.
          cache-from: type=gha,scope=container-image
          cache-to: type=gha,mode=max,scope=container-image
          tags: |
            ghcr.io/perchemop/weather-monitor:${{ github.ref_name }}
            ghcr.io/perchemop/weather-monitor:latest

      # The release body must name the exact image the tag produced, so the
      # digest is appended to the (still draft) release notes.
      - name: Record the image digest on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/perchemop/weather-monitor"
          DIGEST="${{ steps.build.outputs.digest }}"
          {
            printf "### Container image\n\n"
            printf "- \`%s:%s\`\n" "${IMAGE}" "${GITHUB_REF_NAME}"
            printf "- \`%s@%s\` (linux/amd64, linux/arm64)\n" "${IMAGE}" "${DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > release-body.md
          if grep -q "${IMAGE}@sha256:" release-body.md; then
            echo "digest already recorded; leaving the release notes unchanged"
            exit 0
          fi
          printf "\n---\n\n### Container image\n\n\`%s@%s\` (linux/amd64, linux/arm64)\n" "$IMAGE" "$DIGEST" >> release-body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-body.md
