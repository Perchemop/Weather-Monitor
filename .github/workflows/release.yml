name: Release

# Progressive semver releases (guide §4 / §6). A tag push builds the server
# bundle and the static bundle, gates on the full verification suite, attaches
# checksummed artefacts, and publishes a GitHub Release whose notes come from
# the matching CHANGELOG section (falling back to generated notes).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test suite (88 checks)
        run: npm test

      - name: Build server bundle
        run: npm run build

      - name: Build static bundle (GitHub Pages variant)
        run: npm run build:static

      - name: Package artefacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "construction-weather-monitor-${VERSION}-server.tar.gz" dist
          cd dist-static && zip -qr "../construction-weather-monitor-${VERSION}-static.zip" . && cd ..
          sha256sum "construction-weather-monitor-${VERSION}-server.tar.gz" \
                    "construction-weather-monitor-${VERSION}-static.zip" > checksums-${VERSION}.txt
          cat "checksums-${VERSION}.txt"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Take the body of the "## [x.y.z]" section that matches this tag.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${VERSION}; using generated notes." >&2
            echo "Release ${GITHUB_REF_NAME} — see CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: |
            construction-weather-monitor-*.tar.gz
            construction-weather-monitor-*.zip
            checksums-*.txt

      - name: Upload build artefacts (workflow run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            dist-static/
          retention-days: 14

  # Multi-architecture container image (research: multi-arch-container-images.md).
  # Only tags publish to GHCR; PR verification stays build-only in ci.yml.
  # The image name is written in lowercase — Docker references are
  # case-sensitive and GHCR rejects mixed-case paths.
  container-image:
    name: Container image (linux/amd64 + linux/arm64)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/perchemop/weather-monitor:${{ github.ref_name }}
            ghcr.io/perchemop/weather-monitor:latest
