name: Visual evidence

# Renders the app and uploads PNGs for the designer agent to review
# (guide.md section 27.12). Artefacts only: no pixel baselines are committed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The project's own Playwright config is in tests/ui and starts the server
      # itself (npm run build + node dist/server.cjs on a temporary DATA_DIR).
      - name: Capture screenshots
        working-directory: tests/ui
        run: npx playwright test visual.spec.ts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-evidence
          path: tests/ui/snapshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-report
          path: tests/ui/playwright-report/
          if-no-files-found: warn
          retention-days: 7
