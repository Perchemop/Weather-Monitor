name: Feature request
description: Suggest an idea for this project
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Please check the [ROADMAP](https://github.com/Perchemop/Weather-Monitor/blob/main/ROADMAP.md) first to see if this is already planned. Keep suggestions aligned with the project goals in VISION.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem would this solve? Who would benefit?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your idea. Keep it original and avoid copying trade dress.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this problem.
  - type: dropdown
    id: scope
    attributes:
      label: Fits project scope?
      options:
        - 'Yes, clearly aligned with VISION.md'
        - 'Unsure'
        - 'No'
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to public docs/specs (original summaries only).
