name = "cwm-email-relay"
main = "index.js"
compatibility_date = "2024-11-01"

# Secrets are NOT stored here. Set them with `wrangler secret put`, e.g.:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put EMAIL_FROM
#   wrangler secret put ALERT_TO
#   wrangler secret put RELAY_SECRET
#
# Optional non-secret vars may be added here, e.g.:
# [vars]
# ALLOWED_ORIGIN = "https://perchemop.github.io"
