services:
  weather-monitor:
    build: .
    image: construction-weather-monitor:latest
    container_name: weather-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Copy .env.example to .env and fill in your provider/security settings.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    volumes:
      # Persist the SQLite database, backups, and generated secrets.
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
