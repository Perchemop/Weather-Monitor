services:
  weather-monitor:
    build: .
    image: construction-weather-monitor:latest
    container_name: weather-monitor
    restart: unless-stopped
    ports:
      - '3000:3000'
    # Copy .env.example to .env and fill in your provider/security settings.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    volumes:
      # Persist the SQLite database, backups, and generated secrets.
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional local SMTP catcher for exercising the server email path end-to-end.
  # Start the stack with the "mail" profile:
  #     docker compose --profile mail up --build
  # then set SMTP_HOST=mailpit and SMTP_PORT=1025 (no credentials) and read the
  # delivered alert emails at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: weather-monitor-mail
    profiles: ['mail']
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

